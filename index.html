<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DASHBOARDMASPEWW - Banking System</title>
<style>
/* CSS VARIABEL */
:root {
    --bg-main: #f4f7fa; /* Warna khas M-Banking */
    --bg-card: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --accent: #0d47a1; /* Warna biru khas bank */
    --accent-gold: #b8860b;
}

* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }

body { background: var(--bg-main); color: var(--text-main); min-height: 100vh; }

/* ================= DESKTOP VIEW (Tidak Diubah) ================= */
#appWrapper { width: 100vw; height: 100vh; overflow: hidden; }

@media(min-width: 769px) {
    .mobile-view { display: none !important; }
    .desktop-view { display: flex; width: 100%; height: 100%; }
    /* ... (Struktur Desktop tetap seperti sebelumnya agar tidak berubah) ... */
    .sidebar-desktop { width: 260px; background: #0f172a; color: white; padding: 20px; }
    .main-container-desktop { flex: 1; overflow-y: auto; padding: 20px; }
}

/* ================= MOBILE VIEW (M-BANKING STYLE) ================= */
@media(max-width: 768px) {
    .desktop-view { display: none !important; }
    .mobile-view { display: flex !important; flex-direction: column; height: 100vh; }

    /* Header M-Banking */
    .m-header { background: var(--accent); color: white; padding: 20px; border-radius: 0 0 20px 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .m-header h2 { font-size: 16px; opacity: 0.8; }
    .m-header h1 { font-size: 22px; margin-top: 5px; }

    /* Saldo Card M-Banking */
    .m-saldo-card { background: white; margin: -30px 16px 16px 16px; padding: 20px; border-radius: 15px; box-shadow: 0 10px 15px rgba(0,0,0,0.05); }
    .m-saldo-card p { font-size: 12px; color: var(--text-muted); }
    .m-saldo-card h3 { font-size: 24px; color: var(--accent); margin-top: 5px; }

    /* List Item Khas Bank */
    .m-list-item { background: white; padding: 15px; border-bottom: 1px solid #f1f5f9; display: flex; align-items: center; gap: 15px; }
    .m-icon { width: 40px; height: 40px; background: #eff6ff; color: var(--accent); border-radius: 50%; display: flex; align-items: center; justify-content: center; }

    /* Bottom Nav Bar Khas M-Banking */
    .m-bottom-nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: white; display: flex; justify-content: space-around; align-items: center; border-top: 1px solid #e2e8f0; }
    .m-nav { display: flex; flex-direction: column; align-items: center; font-size: 10px; color: var(--text-muted); }
}
</style>
</head>
