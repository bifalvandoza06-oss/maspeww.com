<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Keuangan Maspeww</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --accent-gold: #eab308;
            --border: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 70px; /* Ruang untuk navigasi bawah HP */
        }

        header {
            background-color: var(--bg-card);
            padding: 15px 20px;
            text-align: center;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 18px;
            color: var(--accent-blue);
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 15px;
        }

        /* Tab Content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Card Component */
        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Grid Statistik */
        .grid-stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-box {
            background: var(--bg-card);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        .stat-box span {
            font-size: 12px;
            color: var(--text-muted);
        }

        .stat-box h3 {
            font-size: 16px;
            margin-top: 5px;
        }

        /* Form Elements */
        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: var(--accent-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
        }

        button:active {
            opacity: 0.8;
        }

        /* List / Table Styling */
        .list-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
        }

        .list-item:last-child {
            border-bottom: none;
        }

        .txt-masuk { color: var(--accent-green); }
        .txt-keluar { color: var(--accent-red); }
        .txt-emas { color: var(--accent-gold); }

        /* Bottom Navigation untuk HP */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--bg-card);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            width: auto;
            padding: 0;
        }

        .nav-item.active {
            color: var(--accent-blue);
        }

        .nav-item span.icon {
            font-size: 18px;
            margin-bottom: 2px;
        }

        /* Responsive untuk Layar Besar */
        @media (min-width: 768px) {
            .bottom-nav {
                display: none; /* Sembunyikan navbar bawah di PC, bisa pakai header nav jika mau */
            }
            body {
                padding-bottom: 20px;
            }
            .desktop-nav {
                display: flex;
                gap: 10px;
                justify-content: center;
                margin-bottom: 15px;
            }
            .desktop-nav button {
                width: auto;
                padding: 8px 16px;
                background: var(--bg-card);
                border: 1px solid var(--border);
            }
            .desktop-nav button.active {
                background: var(--accent-blue);
                border-color: var(--accent-blue);
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>💎 Dashboard Keuangan Maspeww</h1>
    </header>

    <div class="container">
        <!-- Navigasi khusus tampilan Desktop/PC -->
        <div class="desktop-nav" style="display: none;" id="desktopNav">
            <button onclick="switchTab('dashboard')" class="d-btn active" id="btn-dash">Dashboard</button>
            <button onclick="switchTab('transaksi')" class="d-btn" id="btn-trx">Transaksi</button>
            <button onclick="switchTab('rekening')" class="d-btn" id="btn-rek">Rekening</button>
            <button onclick="switchTab('laporan')" class="d-btn" id="btn-lap">Laporan</button>
        </div>

        <!-- TAB 1: DASHBOARD -->
        <div id="tab-dashboard" class="tab-content active">
            <div class="grid-stats">
                <div class="stat-box">
                    <span>Total Saldo</span>
                    <h3 id="dashTotalSaldo">Rp 0</h3>
                </div>
                <div class="stat-box">
                    <span>Akumulasi Emas</span>
                    <h3 id="dashTotalEmas" class="txt-emas">0.00 gr</h3>
                </div>
                <div class="stat-box">
                    <span>Masuk Bulan Ini</span>
                    <h3 id="dashMasuk" class="txt-masuk">Rp 0</h3>
                </div>
                <div class="stat-box">
                    <span>Keluar Bulan Ini</span>
                    <h3 id="dashKeluar" class="txt-keluar">Rp 0</h3>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Ringkasan Kategori Bulan Ini</div>
                <div id="kategoriSummaryContainer">
                    <p style="font-size: 12px; color: var(--text-muted);">Memuat data...</p>
                </div>
            </div>
        </div>

        <!-- TAB 2: TRANSAKSI -->
        <div id="tab-transaksi" class="tab-content">
            <div class="card">
                <div class="card-title">Tambah Transaksi Baru</div>
                <form id="formTransaksi" onsubmit="handleTambahTransaksi(event)">
                    <div class="form-group">
                        <label>Jenis Transaksi</label>
                        <select id="trxJenis" onchange="updateKategoriOptions()">
                            <option value="Masuk">Pemasukan</option>
                            <option value="Keluar">Pengeluaran</option>
                            <option value="Emas">Beli Emas</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Rekening / Dompet</label>
                        <select id="trxRekening" required></select>
                    </div>
                    <div class="form-group">
                        <label>Kategori</label>
                        <select id="trxKategori" required></select>
                    </div>
                    <div class="form-group">
                        <label>Nominal (Rp)</label>
                        <input type="number" id="trxNominal" placeholder="Contoh: 50000" required>
                    </div>
                    <div class="form-group" id="groupGram" style="display: none;">
                        <label>Berat Emas (Gram)</label>
                        <input type="number" step="0.01" id="trxGram" placeholder="Contoh: 1.5">
                    </div>
                    <div class="form-group">
                        <label>Tanggal</label>
                        <input type="date" id="trxTanggal" required>
                    </div>
                    <div class="form-group">
                        <label>Keterangan (Opsional)</label>
                        <textarea id="trxKet" rows="2" placeholder="Catatan tambahan..."></textarea>
                    </div>
                    <button type="submit">Simpan Transaksi</button>
                </form>
            </div>

            <div class="card">
                <div class="card-title">Riwayat Transaksi</div>
                <div id="riwayatTransaksiList">
                    <!-- Daftar transaksi akan muncul di sini -->
                </div>
            </div>
        </div>

        <!-- TAB 3: REKENING & DOMPET -->
        <div id="tab-rekening" class="tab-content">
            <div class="card">
                <div class="card-title">Tambah Rekening / Dompet</div>
                <form id="formRekening" onsubmit="handleTambahRekening(event)">
                    <div class="form-group">
                        <label>Nama Rekening / Dompet</label>
                        <input type="text" id="rekNama" placeholder="Contoh: BCA, Dompet Tunai, E-Wallet" required>
                    </div>
                    <div class="form-group">
                        <label>Saldo Awal (Rp)</label>
                        <input type="number" id="rekSaldo" placeholder="0" required>
                    </div>
                    <button type="submit">Tambah Rekening</button>
                </form>
            </div>

            <div class="card">
                <div class="card-title">Daftar Rekening Aktif</div>
                <div id="rekeningListContainer"></div>
            </div>
        </div>

        <!-- TAB 4: LAPORAN & PENGATURAN -->
        <div id="tab-laporan" class="tab-content">
            <div class="card">
                <div class="card-title">Pusat Data & Cadangan</div>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <button onclick="downloadJSON()" style="background: var(--bg-input); border: 1px solid var(--border);">Unduh Cadangan (JSON)</button>
                    <button onclick="exportCSV()" style="background: var(--bg-input); border: 1px solid var(--border);">Ekspor Laporan (CSV)</button>
                    <div style="margin-top: 5px;">
                        <label style="margin-bottom: 5px;">Pulihkan Data (Upload JSON):</label>
                        <input type="file" id="importFile" accept=".json" onchange="restoreJSON(event)" style="padding: 5px;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- BOTTOM NAVIGATION (Khusus HP) -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('dashboard')" id="nav-dash">
            <span class="icon">📊</span>
            <span>Dashboard</span>
        </button>
        <button class="nav-item" onclick="switchTab('transaksi')" id="nav-trx">
            <span class="icon">📝</span>
            <span>Transaksi</span>
        </button>
        <button class="nav-item" onclick="switchTab('rekening')" id="nav-rek">
            <span class="icon">💳</span>
            <span>Rekening</span>
        </button>
        <button class="nav-item" onclick="switchTab('laporan')" id="nav-lap">
            <span class="icon">⚙️</span>
            <span>Lainnya</span>
        </button>
    </nav>

    <script>
        // --- DATABASE LOCALSTORAGE ---
        let db = JSON.parse(localStorage.getItem('maspeww_db')) || {
            rekening: [
                { id: 1, nama: 'Dompet Tunai', saldo: 500000 },
                { id: 2, nama: 'Rekening Bank', saldo: 2500000 }
            ],
            transaksi: []
        };

        function saveDB() {
            localStorage.setItem('maspeww_db', JSON.stringify(db));
        }

        // --- NAVIGASI TAB ---
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');

            // Update Navigasi HP
            document.querySelectorAll('.bottom-nav .nav-item').forEach(el => el.classList.remove('active'));
            let activeNav = document.getElementById('nav-' + tabId.substring(0, 3));
            if (activeNav) activeNav.classList.add('active');

            // Update Navigasi Desktop
            document.querySelectorAll('.desktop-nav button').forEach(el => el.classList.remove('active'));
            let activeDesk = document.getElementById('btn-' + tabId.substring(0, 3));
            if (activeDesk) activeDesk.classList.add('active');
        }

        // Deteksi Tampilan untuk Desktop Navigation
        if (window.innerWidth >= 768) {
            document.getElementById('desktopNav').style.display = 'flex';
        }

        // Format Rupiah
        function formatRupiah(angka) {
            return 'Rp ' + Number(angka).toLocaleString('id-ID');
        }

        // Set tanggal hari ini default pada form
        document.getElementById('trxTanggal').valueAsDate = new Date();

        // --- KATEGORI ---
        const kategoriList = {
            'Masuk': ['Gaji', 'Bonus', 'Investasi', 'Lainnya'],
            'Keluar': ['Makan & Minum', 'Transportasi', 'Belanja', 'Tagihan', 'Hiburan', 'Lainnya'],
            'Emas': ['Tabungan Emas Fisik', 'Digital Gold']
        };

        function updateKategoriOptions() {
            let jenis = document.getElementById('trxJenis').value;
            let katSelect = document.getElementById('trxKategori');
            let groupGram = document.getElementById('groupGram');

            katSelect.innerHTML = '';
            kategoriList[jenis].forEach(kat => {
                let opt = document.createElement('option');
                opt.value = kat;
                opt.textContent = kat;
                katSelect.appendChild(opt);
            });

            if (jenis === 'Emas') {
                groupGram.style.display = 'block';
                document.getElementById('trxGram').required = true;
            } else {
                groupGram.style.display = 'none';
                document.getElementById('trxGram').required = false;
            }
        }

        // --- RENDER REKENING ---
        function renderRekening() {
            let rekSelect = document.getElementById('trxRekening');
            let rekContainer = document.getElementById('rekeningListContainer');
            
            rekSelect.innerHTML = '';
            rekContainer.innerHTML = '';

            db.rekening.forEach(r => {
                // Dropdown Form
                let opt = document.createElement('option');
                opt.value = r.id;
                opt.textContent = r.nama;
                rekSelect.appendChild(opt);

                // List Card Rekening
                rekContainer.innerHTML += `
                    <div class="list-item">
                        <div>
                            <b>${r.nama}</b>
                        </div>
                        <div style="text-align: right;">
                            <b class="txt-masuk">${formatRupiah(r.saldo)}</b><br>
                            <button onclick="hapusRekening(${r.id})" style="background:none; color:var(--accent-red); width:auto; padding:2px 5px; font-size:11px; margin-top:3px;">Hapus</button>
                        </div>
                    </div>
                `;
            });
        }

        // --- TAMBAH & HAPUS REKENING ---
        function handleTambahRekening(e) {
            e.preventDefault();
            let nama = document.getElementById('rekNama').value;
            let saldo = parseFloat(document.getElementById('rekSaldo').value);

            let newRek = {
                id: Date.now(),
                nama: nama,
                saldo: saldo
            };

            db.rekening.push(newRek);
            saveDB();
            renderAll();
            document.getElementById('formRekening').reset();
            alert('Rekening berhasil ditambahkan!');
        }

        function hapusRekening(id) {
            if (confirm('Yakin ingin menghapus rekening ini?')) {
                db.rekening = db.rekening.filter(r => r.id !== id);
                saveDB();
                renderAll();
            }
        }

        // --- TRANSAKSI ---
        function handleTambahTransaksi(e) {
            e.preventDefault();
            let jenis = document.getElementById('trxJenis').value;
            let rekeningId = parseInt(document.getElementById('trxRekening').value);
            let kategori = document.getElementById('trxKategori').value;
            let nominal = parseFloat(document.getElementById('trxNominal').value);
            let gram = parseFloat(document.getElementById('trxGram').value) || 0;
            let tgl = document.getElementById('trxTanggal').value;
            let ket = document.getElementById('trxKet').value;

            let rekening = db.rekening.find(r => r.id === rekeningId);
            if (!rekening) return alert('Rekening tidak ditemukan!');

            // Sesuaikan Saldo Rekening
            if (jenis === 'Masuk') {
                rekening.saldo += nominal;
            } else if (jenis === 'Keluar' || jenis === 'Emas') {
                if (rekening.saldo < nominal) {
                    alert('Saldo pada rekening tidak mencukupi!');
                    return;
                }
                rekening.saldo -= nominal;
            }

            let newTrx = {
                id: Date.now(),
                jenis, rekeningId, kategori, nominal, gram, tgl, ket
            };

            db.transaksi.unshift(newTrx);
            saveDB();
            renderAll();
            document.getElementById('formTransaksi').reset();
            document.getElementById('trxTanggal').valueAsDate = new Date();
            updateKategoriOptions();
            alert('Transaksi berhasil disimpan!');
        }

        function hapusTransaksi(id) {
            if (confirm('Hapus transaksi ini? Saldo akan dikembalikan.')) {
                let trx = db.transaksi.find(t => t.id === id);
                if (trx) {
                    let rekening = db.rekening.find(r => r.id === trx.rekeningId);
                    if (rekening) {
                        if (trx.jenis === 'Masuk') rekening.saldo -= trx.nominal;
                        else if (trx.jenis === 'Keluar' || trx.jenis === 'Emas') rekening.saldo += trx.nominal;
                    }
                    db.transaksi = db.transaksi.filter(t => t.id !== id);
                    saveDB();
                    renderAll();
                }
            }
        }

        // --- RENDER TRANSAKSI & RIWAYAT ---
        function renderTransaksi() {
            let container = document.getElementById('riwayatTransaksiList');
            container.innerHTML = '';

            if (db.transaksi.length === 0) {
                container.innerHTML = `<p style="font-size: 12px; color: var(--text-muted);">Belum ada riwayat transaksi.</p>`;
                return;
            }

            db.transaksi.forEach(t => {
                let rek = db.rekening.find(r => r.id === t.rekeningId);
                let rekName = rek ? rek.nama : 'Dihapus';
                let warnaClass = t.jenis === 'Masuk' ? 'txt-masuk' : (t.jenis === 'Emas' ? 'txt-emas' : 'txt-keluar');
                let tanda = t.jenis === 'Masuk' ? '+' : '-';

                container.innerHTML += `
                    <div class="list-item">
                        <div>
                            <b>${t.kategori}</b> (${rekName})<br>
                            <span style="font-size: 11px; color: var(--text-muted);">${t.tgl} ${t.ket ? '• ' + t.ket : ''}</span>
                        </div>
                        <div style="text-align: right;">
                            <b class="${warnaClass}">${tanda} ${formatRupiah(t.nominal)}</b><br>
                            ${t.gram > 0 ? `<span class="txt-emas" style="font-size: 11px;">${t.gram} gr</span><br>` : ''}
                            <button onclick="hapusTransaksi(${t.id})" style="background:none; color:var(--accent-red); width:auto; padding:0; font-size:10px;">Hapus</button>
                        </div>
                    </div>
                `;
            });
        }

        // --- DASHBOARD STATS & KATEGORI ---
        function renderDashboardStats() {
            let totalSaldo = db.rekening.reduce((acc, r) => acc + r.saldo, 0);
            let totalEmas = db.transaksi.filter(t => t.jenis === 'Emas').reduce((acc, t) => acc + (t.gram || 0), 0);

            let now = new Date();
            let bulanIni = now.toISOString().slice(0, 7); // Format: YYYY-MM

            let masukBulanIni = 0;
            let keluarBulanIni = 0;
            let kategoriMap = {};

            db.transaksi.forEach(t => {
                if (t.tgl.startsWith(bulanIni)) {
                    if (t.jenis === 'Masuk') {
                        masukBulanIni += t.nominal;
                    } else if (t.jenis === 'Keluar' || t.jenis === 'Emas') {
                        keluarBulanIni += t.nominal;
                        if (t.jenis === 'Keluar') {
                            kategoriMap[t.kategori] = (kategoriMap[t.kategori] || 0) + t.nominal;
                        }
                    }
                }
            });

            document.getElementById('dashTotalSaldo').textContent = formatRupiah(totalSaldo);
            document.getElementById('dashTotalEmas').textContent = totalEmas.toFixed(2) + ' gr';
            document.getElementById('dashMasuk').textContent = formatRupiah(masukBulanIni);
            document.getElementById('dashKeluar').textContent = formatRupiah(keluarBulanIni);

            // Render Kategori Summary
            let katContainer = document.getElementById('kategoriSummaryContainer');
            katContainer.innerHTML = '';

            let keys = Object.keys(kategoriMap);
            if (keys.length === 0) {
                katContainer.innerHTML = `<p style="font-size: 12px; color: var(--text-muted);">Tidak ada pengeluaran pada bulan ini.</p>`;
                return;
            }

            keys.forEach(kat => {
                let nominal = kategoriMap[kat];
                let persen = keluarBulanIni > 0 ? ((nominal / keluarBulanIni) * 100).toFixed(1) : 0;
                katContainer.innerHTML += `
                    <div style="margin-bottom: 8px;">
                        <div style="display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 3px;">
                            <span>${kat} (${persen}%)</span>
                            <b class="txt-keluar">${formatRupiah(nominal)}</b>
                        </div>
                        <div style="width: 100%; background: var(--bg-input); height: 5px; border-radius: 3px; overflow: hidden;">
                            <div style="width: ${persen}%; background: var(--accent-red); height: 100%;"></div>
                        </div>
                    </div>
                `;
            });
        }

        // --- BACKUP & EXPORT ---
        function downloadJSON() {
            let dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
            let dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `backup_maspeww_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        function restoreJSON(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                try {
                    let parsed = JSON.parse(e.target.result);
                    if (parsed.rekening && parsed.transaksi) {
                        db = parsed;
                        saveDB();
                        renderAll();
                        alert('Data berhasil dipulihkan!');
                    } else {
                        alert('Format file tidak valid.');
                    }
                } catch (err) {
                    alert('Gagal membaca file.');
                }
            };
            reader.readAsText(file);
        }

        function exportCSV() {
            let csv = 'Tanggal,Jenis,Kategori,Rekening,Nominal,Gram,Keterangan\n';
            db.transaksi.forEach(t => {
                let rek = db.rekening.find(r => r.id === t.rekeningId);
                let rekName = rek ? rek.nama : 'Dihapus';
                csv += `"${t.tgl}","${t.jenis}","${t.kategori}","${rekName}",${t.nominal},${t.gram || 0},"${t.ket || ''}"\n`;
            });

            let blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            let url = URL.createObjectURL(blob);
            let dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", url);
            dlAnchor.setAttribute("download", `mutasi_maspeww_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
        }

        // --- GLOBAL RENDER ---
        function renderAll() {
            renderRekening();
            renderTransaksi();
            renderDashboardStats();
        }

        // Jalankan Inisialisasi Pertama
        updateKategoriOptions();
        renderAll();
    </script>
