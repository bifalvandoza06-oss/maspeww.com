<!DOCTYPE html>
<html lang="id">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root { --primary: #004a99; --bg-mobile: #f4f6f8; }

        /* --- LAYOUT DESKTOP --- */
        body { font-family: sans-serif; background: #eef2f7; }
        .sidebar { width: 250px; height: 100vh; position: fixed; background: #fff; }
        .main-content { margin-left: 250px; padding: 20px; }
        
        /* --- TAMPILAN MOBILE (M-BANKING STYLE) --- */
        @media screen and (max-width: 768px) {
            .sidebar { display: none; } /* Sembunyikan sidebar desktop */
            .main-content { margin-left: 0; padding: 0; }
            
            /* Bottom Navigation Bar (Ala M-Banking) */
            .mobile-nav {
                position: fixed; bottom: 0; width: 100%; height: 60px;
                background: white; display: flex; justify-content: space-around;
                align-items: center; border-top: 1px solid #ddd;
            }

            /* Kartu Saldo Ala Bank */
            .saldo-card {
                background: linear-gradient(135deg, #004a99, #007bff);
                color: white; margin: 20px; padding: 20px;
                border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            }

            /* List Transaksi Ringkas */
            .trx-item { 
                background: white; margin: 0 20px; padding: 15px;
                border-bottom: 1px solid #f0f0f0; display: flex; justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar Desktop -->
    <div class="sidebar">...Menu Desktop...</div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Versi Mobile (Hanya tampil di HP) -->
        <div class="mobile-only-header">
            <div class="saldo-card">
                <p>Total Saldo</p>
                <h2>Rp 15.000.000</h2>
            </div>
        </div>

        <!-- Daftar Transaksi -->
        <div class="trx-list">
            <div class="trx-item">
                <span>Transfer ke Budi</span>
                <span style="color: red;">- Rp 50.000</span>
            </div>
        </div>
    </div>

    <!-- Bottom Nav Mobile -->
    <div class="mobile-nav">
        <div>Home</div>
        <div>Mutasi</div>
        <div>Transfer</div>
        <div>Profil</div>
    </div>
</body>
</html>
